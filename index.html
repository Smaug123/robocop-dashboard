<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robocop Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js" integrity="sha384-2NndlFAl0twi2nmu3w9mixodZFiN2fbxlakcYJF86bn1JeS1VB87/XqA7cqymzS+" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js" integrity="sha384-osZDKVu4ipZP703HmPOhWdyBajcFyjX2Psjk//TG1Rc0AdwEtuToaylrmcK3LdAl" crossorigin="anonymous"></script>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">Robocop</h1>
            <div class="header-status">
                <div class="status-indicator" id="systemStatus"></div>
                <span id="systemStatusText">System Active</span>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openSettingsModal()" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Summary Bar -->
        <div class="summary-bar" id="summaryBar">
            <div class="summary-stat">
                <span class="summary-value" id="inFlightCount">0</span>
                <span class="summary-label">In Flight</span>
            </div>
            <div class="summary-stat">
                <span class="summary-value success" id="completedCount">0</span>
                <span class="summary-label">Completed Today</span>
            </div>
            <div class="summary-stat">
                <span class="summary-value warning" id="issuesCount">0</span>
                <span class="summary-label">Issues Found</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <span class="control-label">Auto-refresh</span>
                <select id="refreshInterval" onchange="updateRefreshInterval()">
                    <option value="0">Off</option>
                    <option value="30">30s</option>
                    <option value="60" selected>1m</option>
                    <option value="120">2m</option>
                    <option value="300">5m</option>
                </select>
            </div>
            <div class="control-group">
                <button class="btn" onclick="loadBatches()" id="refreshBtn">Refresh</button>
                <div class="spinner hidden" id="loading"></div>
            </div>
            <span class="last-update" id="lastUpdate"></span>
        </div>

        <!-- Message Display -->
        <div class="message" id="message">
            <span id="messageText"></span>
        </div>

        <!-- Schema Warning -->
        <div class="message warning" id="schemaWarning">
            <span id="schemaWarningText"></span>
        </div>

        <!-- In Progress Section -->
        <section class="section" id="inProgressSection">
            <div class="section-header">
                <h2 class="section-title">In Progress</h2>
            </div>
            <div class="in-progress-list" id="inProgressList">
                <!-- Cards rendered here -->
            </div>
        </section>

        <!-- Recent Section -->
        <section class="section" id="recentSection">
            <div class="section-header">
                <h2 class="section-title">Recent</h2>
                <button class="section-toggle" id="recentToggle" onclick="toggleRecentSection()">
                    Collapse
                </button>
            </div>
            <div class="recent-list expanded" id="recentList">
                <!-- Items rendered here -->
            </div>
        </section>
    </div>

    <!-- Detail Panel -->
    <div class="panel-overlay" id="panelOverlay" onclick="closeDetailPanel()"></div>
    <aside class="detail-panel" id="detailPanel">
        <div class="panel-header">
            <h3 class="panel-title" id="panelTitle">Review Details</h3>
            <button class="panel-close" onclick="closeDetailPanel()">&times;</button>
        </div>
        <div class="panel-content" id="panelContent">
            <!-- Detail content rendered here -->
        </div>
    </aside>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Settings</h3>
                <button class="panel-close" onclick="closeSettingsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-field">
                    <label for="apiKey">OpenAI API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-...">
                </div>
                <div class="modal-field">
                    <label for="githubToken">GitHub Token <span class="field-hint">(needs repo or Pull requests:read)</span></label>
                    <input type="password" id="githubToken" placeholder="ghp_...">
                </div>
                <div class="modal-field">
                    <div class="modal-field-inline">
                        <input type="checkbox" id="displayCancelledJobs">
                        <label for="displayCancelledJobs" style="margin-bottom: 0;">Display cancelled jobs</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeSettingsModal()">Cancel</button>
                <button class="btn" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="shell/app.js"></script>
</body>
</html>
